<section class="container">

<h1>Contact Me</h1>

<p>
Interested in research collaboration, industry partnerships, R&D opportunities, or PhD supervision? Please get in touch.
</p>

<form class="contact-form"
action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<label>Name</label>

<input type="text"
name="name"
placeholder="Your name"
required>

<label>Email</label>

<input type="email"
name="email"
placeholder="Your email"
required>

<label>Purpose</label>

<select name="purpose" required>

<option value="" disabled selected>
Select enquiry type
</option>

<option>Research Collaboration</option>
<option>Industry Partnership</option>
<option>R&D Opportunity</option>
<option>PhD Supervision</option>
<option>Speaking / Workshop Invitation</option>
<option>Other</option>

</select>

<label>Message</label>

<textarea 
name="message"
rows="6"
placeholder="Your message"
required>
</textarea>

<button type="submit">
Send Message
</button>

</form>

</section>

<footer class="container">
© Dr Ahmad Mohsin
</footer>
